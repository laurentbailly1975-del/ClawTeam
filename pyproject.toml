[project]
name = "jobcraft"
version = "0.1.0"
description = "Assistant de candidature local propuls\u00e9 par Claude"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62.0"]

[project.scripts]
jobcraft = "jobcraft.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobcraft"]
